name: One-click Cloudflare deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22
      - name: Validate, build and deploy
        run: node tools/deploy.mjs --non-interactive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_WORKER_NAME: ${{ vars.DEPLOY_WORKER_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
